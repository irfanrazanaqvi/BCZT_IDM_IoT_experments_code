<text x="1150" y="232" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2733">5</text>
<circle cx="1030" cy="445" r="14" fill="#ffffff" stroke="#3a4654" stroke-width="2.5"/>
<text x="1030" y="452" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b2733">6</text>
<line x1="30" y1="628" x2="1230" y2="628" stroke="#c9d1da" stroke-width="1.5"/>
<circle cx="44" cy="648" r="12" fill="#ffffff" stroke="#3a4654" stroke-width="2"/>
<text x="44" y="654" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2733">1</text>
<text x="68" y="654" font-size="18" fill="#1b2733">Signed request (DID, nonce, signature)</text>
<circle cx="44" cy="675" r="12" fill="#ffffff" stroke="#3a4654" stroke-width="2"/>
<text x="44" y="681" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2733">2</text>
<text x="68" y="681" font-size="18" fill="#1b2733">Request context to the trust engine</text>
<circle cx="44" cy="702" r="12" fill="#ffffff" stroke="#3a4654" stroke-width="2"/>
