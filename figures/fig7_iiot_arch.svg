<text x="68" y="708" font-size="18" fill="#1b2733">Trust score T and anomaly A to the oracle</text>
<circle cx="664" cy="648" r="12" fill="#ffffff" stroke="#3a4654" stroke-width="2"/>
<text x="664" y="654" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2733">4</text>
<text x="688" y="654" font-size="18" fill="#1b2733">Signed attestation on the audited path (T2–T3)</text>
<circle cx="664" cy="675" r="12" fill="#ffffff" stroke="#3a4654" stroke-width="2"/>
<text x="664" y="681" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2733">5</text>
<text x="688" y="681" font-size="18" fill="#1b2733">Chain state for the local fast path (T0–T1)</text>
<circle cx="664" cy="702" r="12" fill="#ffffff" stroke="#3a4654" stroke-width="2"/>
<text x="664" y="708" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b2733">6</text>
<text x="688" y="708" font-size="18" fill="#1b2733">Contract events synchronised to the replica</text>
</svg>